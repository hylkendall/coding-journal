<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Survey Form</title>
    </head>

    <body>
        <h1 id="title">freeCodeCamp Survey Form</h1>
        <p id="description">Thank you for taking the time to help us improve the platform</p>

        <form id="survey-form">

            <fieldset>
                <legend>Basic information</legend>
                <label id="name-label" for="name">Name</label>
                <input id="name" type="text" name="name" required placeholder="Enter your name">
                <label id="email-label" for="email">Email</label>
                <input id="email" type="email" name="email" required placeholder="Enter your email">
                <label id="number-label" for="number">Age(optional)</label>
                <input id="number" type="number" name="age" min="1" max="100" placeholder="age">
            </fieldset>

            <fieldset>
                <legend>Role</legend>
                <label for="dropdown" >Which option best describes your current role?</label><br>
                <select id="dropdown" name="dropdown">
                    <option selected disabled value="">Select current role</option>
                    <option value="student">Student</option>
                    <option value="full-time-job">Full Time Job</option>
                    <option value="full-time-learner">Full Time Learner</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                    <option value="other">Other</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Would you recommend freeCodeCamp to a friend?</legend>
                <input id="definitely" type="radio" value="definitely" name="recommend">
                <label for="definitely">Definitely</label>
                <input id="maybe" type="radio" value="maybe" name="recommend"> 
                <label for="maybe">Maybe</label>
                <input id="not-sure" type="radio" value="not-sure" name="recommend">
                <label for="not-sure">Not sure</label>
            </fieldset>

            <fieldset>
                <legend>What would you like to see improved? (Check all that apply)</legend>
                <input type="checkbox" name="improved" 
                id="front-end-projects"
                value="front-end-projects">
                <label for="front-end-projects">Front-end Projects</label>
                <input type="checkbox" name="improved"
                id="back-end-projects"
                value="back-end-projects">
                <label for="back-end-projects">Back-end Projects</label>
                <input type="checkbox" name="improved"
                id="data-visualization"
                value="data-visualization">
                <label for="data-visualization">Data Visualization</label>
                <input type="checkbox" name="improved"
                id="challenges"
                value="challenges">
                <label for="challenges">Challenges</label>
            </fieldset>
            
            <label for="comments">Any comments or suggestions?</label>
            <textarea id="comments" name="comments" cols="30" rows="10"></textarea>
            <button id="submit" type="submit">Submit</button>            

        </form>
    </body>
</html>
