<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <title>游戏音效开关</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="gamemusictoggle">
            <h1>游戏音效开关</h1>
            <label for="background-music"><input id="background-music" type="checkbox" name="background-music" checked>背景音乐</label>
            <label for="sound-effects"><input id="sound-effects" type="checkbox" name="sound-effects" >音效</label>
            <label for="vibration"><input id="vibration" type="checkbox" name="vibration" disabled>震动</label>
        </div>
    </body>
</html>
