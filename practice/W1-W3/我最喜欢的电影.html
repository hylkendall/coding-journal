                <p>剧情简介：唯、澪、律、紬這四個即將畢業的輕音部三年級生，一如往常地在社辦喝茶、討論樂團的發展方向，過著一派悠閒的日子。某天，他們得知班上的同學們正在企劃「畢業旅行」，唯等人因此決定自己也要來辦一場畢業旅行。梓知道此事後也表示想參加。經過一番討論，每個人先提出各自想去的地點，最後用抽籤的方式決定要去「倫敦」。於是，大家一邊準備著旅遊指南等旅行所需的各種物品，一邊期待這場即將到來的倫敦之旅……。</p>
