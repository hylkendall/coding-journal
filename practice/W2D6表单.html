<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>联系我们</title>
    </head>
    <body>
        <header>
            <h1>站点名</h1>
            <h2>副标题</h2>
        </header>
        <main>
            <form>
            <fieldset>
                <legend>基本信息</legend>
                <label for="name">姓名：</label>
                <input id="name" type="text" required name="name">
                <label for="email">邮箱：</label>
                <input id="email" type="email" required name="email">
            </fieldset>

            
                <label for="consult">请选择咨询主题</label>
                <select id="consult" name="consult">
                    <option value="售前">售前</option>
                    <option value="售后">售后</option>
                    <option value="合作">合作</option>
                </select>


            <fieldset>
                <legend>联系时间</legend>
                <input id="time-morning" type="radio" value="morning" name="contact-time">
                <label for="time-morning">上午</label>
                <input id="time-afternoon" type="radio" value="afternoon" name="contact-time">
                <label for="time-afternoon">下午</label>
                <input id="time-night" type="radio" value="night" name="contact-time">
                <label for="time-night">晚上</label>
            </fieldset>

            <label for="message">留言板</label>
            <textarea id="message" name="message" cols="30" rows="10"></textarea>

            <button type="submit">提交</button>
            </form>
        </main>
        <footer>
            <p>版权</p>
        </footer>
    </body>
</html>
