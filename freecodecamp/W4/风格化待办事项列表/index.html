<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <h1>My To-Do List</h1>
    <ul class="todo-list">
        <li>
            <input type="checkbox" id="Explore-gaming-keyboards" name="Explore-gaming-keyboards">
            <label for="Explore-gaming-keyboards">Explore gaming keyboards</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" target="_blank" href="https://www.freecodecamp.org/chinese/learn/responsive-web-design-v9/lab-stylized-to-do-list/build-a-stylized-to-do-list#">Store link</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="Finish-the-report" name="Finish-the-report">
            <label for="Finish-the-report">Finish the report</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" target="_blank" href="https://www.freecodecamp.org/chinese/learn/responsive-web-design-v9/lab-stylized-to-do-list/build-a-stylized-to-do-list#">Request Access</a></li>
            </ul>            
        </li>
        <li>
            <input type="checkbox" id="View-Phone-Warranty" name="View-Phone-Warranty">
            <label for="View-Phone-Warranty">View Phone's Warranty</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" target="_blank" href="https://www.freecodecamp.org/chinese/learn/responsive-web-design-v9/lab-stylized-to-do-list/build-a-stylized-to-do-list#">View Receipts</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="Check-Processor-Specs" name="Check-Processor-Specs">
            <label for="Check-Processor-Specs">Check Processor Specs</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" target="_blank" href="https://www.freecodecamp.org/chinese/learn/responsive-web-design-v9/lab-stylized-to-do-list/build-a-stylized-to-do-list#">View Model Number</a></li>
            </ul>
        </li>
    </ul>
</body>

</html>
