<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Selection Feature Page</title>
    <link href="styles.css" rel="stylesheet">
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card" for="CloudStorage">
            <input type="checkbox" id="CloudStorage" name="CloudStorage">
            <h2>Cloud Storage</h2>
            <p>100 Gigabyte secure storage</p>
        </label>
        <label class="feature-card" for="DedicatedSupport">
            <input type="checkbox" id="DedicatedSupport" name="DedicatedSupport">
            <h2>Dedicated Support</h2>
            <p>24/7 customer help</p>
        </label>
        <label class="feature-card" for="AdvancedAnalytics">
            <input type="checkbox" id="AdvancedAnalytics" name="AdvancedAnalytics">
            <h2>Advanced Analytics</h2>
            <p>Insights & reports</p>
        </label>
        <label class="feature-card" for="CustomUserThemes">
            <input type="checkbox" id="CustomUserThemes" name="CustomUserThemes">
            <h2>Custom User Themes</h2>
            <p>Personalized dashboard design</p>
        </label>
        <label class="feature-card" for="MultiUserCollab">
            <input type="checkbox" id="MultiUserCollab" name="MultiUserCollab">
            <h2>Multi-User Collab</h2>
            <p>Team access and sharing</p>
        </label>
        <label class="feature-card" for="APIAccess">
            <input type="checkbox" id="APIAccess" name="APIAccess">
            <h2>API Access</h2>
            <p>Integrate with your custom built tools</p>
        </label>
    </div>
</body>

</html>
