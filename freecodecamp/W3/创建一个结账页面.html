<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <figure>
            <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Commodity metal left hand spoon">
            <figcaption>Left-handed spoon</figcaption>
        </figure>
        <p>$29.99</p>
    </section>
    <section>
        <h2> Payment Information</h2>
        <form>
            <label for="card-name">Cardholder Name<span aria-hidden="true">*</span></label>
            <input id="card-name" type="text" name="card-name" required>
            <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
            <input id="card-number" type="text" name="card-number" required aria-describedby="card-number-help">
            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
            <label for="card-date">Expiry Date<span aria-hidden="true">*</span></label>
            <input id="card-date" type="text" name="card-date" required placeholder="MM/YY">
            <label for="card-cvv">CVV<span aria-hidden="true">*</span></label>
            <input id="card-cvv" type="text" name="card-cvv" required>
            <button type="submit">Place Order</button>
        </form>
    </section>
</body>

</html>
